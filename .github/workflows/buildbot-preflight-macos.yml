name: Buildbot preflight (macOS)

# The macOS jobs of .gitlab-ci.yml, run where they can be watched: the
# buildbot's Macs are Apple Silicon on macOS 14 with Xcode 16.0, and no
# Homebrew. The runner here has Homebrew, which the script keeps out of the
# build (CMAKE_IGNORE_PREFIX_PATH) and the final check would catch.

# Also on a change to what builds LLVM from the tree, or to the third-party
# targets: the Makefile rules and their CMake wrapper met make 3.81 and a
# clang with no SDK of its own only here, and the Vulkan target MoltenVK's
# headers.
on:
  push:
    paths: &paths
      - '.ci/build-macos-libretro.sh'
      - '3rdparty/llvm/CMakeLists.txt'
      - '3rdparty/CMakeLists.txt'
      - 'Makefile'
      - 'rpcs3/libretro/make/llvm/**'
      - '.github/workflows/buildbot-preflight-macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (buildbot preflight)
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Xcode 16.0, the buildbot's
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || { ls /Applications | grep Xcode; exit 1; }
          clang --version

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          KEEP_GOING: 1
        run: |
          sed -i '' 's#url = \.\./\.\./#url = https://github.com/#' .gitmodules
          git submodule -q sync
          .ci/build-macos-libretro.sh

      - uses: actions/upload-artifact@main
        with:
          name: parallel_ps3_libretro-macos-${{ matrix.arch }}-preflight
          path: parallel_ps3_libretro.dylib
