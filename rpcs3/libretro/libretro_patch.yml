  "Disable Dynamic Exposure":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "Whatcookie (address), LibretroAdmin"
    Notes: >-
      Tone mapping keeps a fixed exposure instead of adapting to the scene: the debug menu's ToneMap switch
      (graphics manager byte 0x6EE) on from the start. Stops exposure flicker, and saves the GPU the exposure pass.
    Patch Version: 1.0
    Patch:
      - [ be16, 0x00025EDC, 0x981F ] # stb r0,0x6EE(r31) // r0 is 1 here; the retail code stores 0 from r29
  "Fixed Frame Pacing":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "LibretroAdmin"
    Notes: >-
      Needs "Unlock FPS" (alone it changes nothing). The game advances a fixed time each frame and waits for one
      vblank per frame, instead of measuring the host clock: pacing comes from the emulated vblank, the same every run, with no catch-up jumps.
      Choose 60 FPS with a 60 Hz vblank (default), or 120 FPS with the Vblank Rate set to 120. If the game cannot
      hold the rate it slows down, as on a console, rather than skipping time.
    Configurable Values:
      "Frame Rate":
        Type: double_enum
        Value: 0.016666668
        Allowed Values:
          "60 FPS": 0.016666668
          "120 FPS (Vblank Rate 120)": 0.008333334
    Patch Version: 1.0
    Patch:
      - [ be32, 0x016C7C68, 0xFFE0E090 ] # fmr f31,f28 // Unlock FPS's timestep: its constant, not host clock ticks
      - [ bef32, 0x016C7C88, "Frame Rate" ] # the constant (Unlock FPS's 50 ms limit), now the frame time
      - [ be32, 0x0002B8F8, 0x20A50001 ] # subfic r5,r5,1 // vblanks per flip: 1 in the 60 FPS mode Unlock FPS sets (it was 0, no wait), 2 in the retail 30 FPS one, as before
