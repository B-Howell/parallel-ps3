Version: 1.2

# The core's own game patches, beside RPCS3's patch.yml: compiled into the core
# and written to patches/libretro_patch.yml in the config dir as patch.yml is
# (install_patches in libretro_core.cpp), read by the patch engine after it
# (append_global_patches) and listed in the Patch Manager. Each was applied to
# its executable with this core's patch parser, with the patches it names
# (Unlock FPS), and its code read back.

# Demon's Souls (US, disc 1.00): debug title menu, fixed exposure and fixed
# frame pacing

